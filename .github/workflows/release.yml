# Generated releases: release-please keeps one release PR open with the next version and notes.
# Merging it tags v<version> and creates the GitHub Release. Written by baton:init.
name: release

on:
  push:
    branches: ["main"] # baton:init sets git.baseBranch
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The token is an environment secret: only runs on the base branch can read it.
    environment: release
    # release-please acts with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN, so CI runs on its PR.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: "main"
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
