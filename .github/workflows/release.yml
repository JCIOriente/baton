# Generated releases: release-please keeps one release PR open with the next version and notes.
# Merging it tags v<version> and creates the GitHub Release. Written by baton:init.
name: release

on:
  push:
    branches: ["main"] # baton:init sets git.baseBranch
  workflow_dispatch:
    inputs:
      # gh workflow run release.yml -f dry_run=true
      dry_run:
        description: "Build and check every package and run the registries' dry-run publish; release and publish nothing"
        type: boolean
        default: false

permissions: {}

# Concurrency is per job, not per workflow: a dry run must not queue behind or cancel a release,
# and a publish waiting for approval must not hold up release-please for later pushes.

jobs:
  release-please:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One release-please at a time. A dry run never joins this group, even with the job skipped.
    concurrency:
      group: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
      cancel-in-progress: false
    # The token is an environment secret: only runs on the base branch can read it.
    environment: release
    # release-please acts with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN, so CI runs on its PR.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: "main"
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
