# CI: runs the repo's validate steps with the baton CLI, so local and CI checks stay identical.
# Written by baton:init, which fills {{version}} from the running plugin's version.
name: ci

on:
  push:
    branches: ["<base-branch>"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Install the tools the repo's validate steps run (linters, test runners, gitleaks, ...).
      # - name: Install tools
      #   run: ...
      - run: npm exec --yes --package=@jcioriente/baton@{{version}} -- baton verify --stage ci
