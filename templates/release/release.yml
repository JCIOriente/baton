# Generated releases: release-please keeps one release PR open with the next version and notes.
# Merging it tags v<version> and creates the GitHub Release. Written by baton:init.
name: release

on:
  push:
    branches: ["<base-branch>"] # baton:init sets git.baseBranch
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The token is an environment secret: only runs on the base branch can read it.
    environment: release
    # release-please acts with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN, so CI runs on its PR.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: "<base-branch>"
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish jobs: trusted publishing (OIDC), so no registry token is stored. The build-npm and
  # verify-crates jobs run dependency and build code with no credentials; the publish-npm and
  # publish-crates jobs, the only ones with id-token, publish what was built and run no
  # dependency code. Each pair publishes the tag release-please just created, refuses a package
  # version that differs from the tag, and skips a version the registry already has, so
  # re-running a failed job is safe.

  # baton:init: keep build-npm and publish-npm only when release.publish has "npm".
  build-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the version matches the tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::package.json version $actual, release version $VERSION and tag $TAG must match (tag v<version>)"
            exit 1
          fi
      - name: Skip a version npm already has
        id: registry
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          # Exits 0 with empty output for a missing version, and E404 for a missing package.
          # Only E404 means "not published"; any other failure (network, auth) fails the job.
          if found=$(npm view "$NAME@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err"); then
            :
          elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            found=""
          else
            cat "$RUNNER_TEMP/npm-view.err" >&2
            echo "::error::could not check npm for $NAME@$VERSION"
            exit 1
          fi
          if [ "$found" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Only npm repos with a package-lock.json get this install: with pnpm, yarn or bun, replace
      # this step with your package manager's install.
      - if: steps.registry.outputs.published != 'true' && hashFiles('package-lock.json') != ''
        run: npm ci
      # Builds that are not a prepare or prepack script (e.g. a dist/ folder) must exist before pack.
      - if: steps.registry.outputs.published != 'true'
        run: npm run build --if-present
      - if: steps.registry.outputs.published != 'true'
        run: npm pack --pack-destination "$RUNNER_TEMP/pack"
      - if: steps.registry.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pack
          if-no-files-found: error
          retention-days: 1

  # baton:init: keep build-npm and publish-npm only when release.publish has "npm".
  publish-npm:
    needs: [release-please, build-npm]
    if: needs.release-please.outputs.release_created == 'true' && needs.build-npm.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0; Node 24 ships both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pack
      - name: Publish the tarball built without credentials
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -- "$RUNNER_TEMP"/pack/*.tgz
          [ "$#" -eq 1 ] || { echo "::error::expected one tarball, found $#"; exit 1; }
          actual=$(tar -xOf "$1" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::tarball version $actual differs from release version $VERSION"
            exit 1
          fi
          # No token: npm exchanges the job's OIDC identity and adds provenance for a public repo.
          npm publish "$1" --ignore-scripts

  # baton:init: keep verify-crates and publish-crates only when release.publish has "crates".
  verify-crates:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Check the version matches the tag
        id: version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # The package defined by the root Cargo.toml (resolves version.workspace = true).
          pkg=$(cargo metadata --no-deps --format-version 1 \
            | jq -c --arg manifest "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $manifest)')
          [ -n "$pkg" ] || { echo "::error::root Cargo.toml defines no package"; exit 1; }
          actual=$(jq -r .version <<<"$pkg")
          if [ "$actual" != "$VERSION" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Cargo.toml version $actual, release version $VERSION and tag $TAG must match (tag v<version>)"
            exit 1
          fi
          echo "name=$(jq -r .name <<<"$pkg")" >> "$GITHUB_OUTPUT"
      - name: Skip a version crates.io already has
        id: registry
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # The crates.io API rejects requests without a User-Agent.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: $REPO release workflow" \
            "https://crates.io/api/v1/crates/$NAME/$VERSION")
          case "$status" in
            200) echo "$NAME $VERSION is already on crates.io; skipping."
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP $status for $NAME $VERSION"; exit 1 ;;
          esac
      # Compiles the crate, so build scripts run here, without credentials.
      - if: steps.registry.outputs.published != 'true'
        run: cargo package

  # baton:init: keep verify-crates and publish-crates only when release.publish has "crates".
  publish-crates:
    needs: [release-please, verify-crates]
    if: needs.release-please.outputs.release_created == 'true' && needs.verify-crates.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # A short-lived token from the job's OIDC identity, revoked when the job ends.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # --no-verify: verify-crates already compiled the package, so no build code sees the token.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify
